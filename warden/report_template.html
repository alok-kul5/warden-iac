<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warden report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0d12; --ink2:#11141b; --panel:#151922; --panel2:#1b2030; --line:#262c3b; --line2:#323a4d;
  --text:#eef1f7; --muted:#9aa3b6; --dim:#6b7489;
  --brand:#f08a24; --brand2:#a3390f;
  --crit:#ff4d5e; --high:#ff8a3d; --med:#f5c542; --low:#5cc8ff; --ok:#3ddc97;
  --user:#7c9cff; --role:#c58bff; --group:#3ddc97;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(900px 420px at 85% -10%,rgba(240,138,36,.28),transparent 60%),
             radial-gradient(700px 380px at -10% 110%,rgba(163,57,15,.25),transparent 60%),var(--ink)}
.hero:before{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.brand svg{width:44px;height:44px;filter:drop-shadow(0 6px 18px rgba(240,138,36,.45))}
.brand b{font:700 20px var(--display);letter-spacing:.02em}
.brand span{color:var(--muted);font:500 12px var(--mono);border:1px solid var(--line2);padding:3px 8px;border-radius:99px}
h1{font:700 clamp(34px,5vw,60px)/1.02 var(--display);margin:0 0 16px;letter-spacing:-.025em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffb15c,var(--brand) 45%,#ff5b3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:620px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chip{font:500 12px var(--mono);color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line2);padding:6px 10px;border-radius:8px}
.chip b{color:var(--text);font-weight:500}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v strong{display:block;font:700 72px/1 var(--display);letter-spacing:-.04em}
.ring .v small{display:block;color:var(--muted);font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font:700 18px var(--display);margin-top:10px;color:#111}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:14px;margin-top:-34px;position:relative;z-index:2}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.sev{position:relative;overflow:hidden}
.sev:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sev .n{font:700 44px/1 var(--display);letter-spacing:-.03em;color:var(--c)}
.sev .l{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;align-content:center}
.facts div{font:500 12px var(--mono);color:var(--muted)}
.facts b{display:block;font:700 22px var(--display);color:var(--text)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:26px 0 6px}
.bar i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:18px;color:var(--muted);font:500 12px var(--mono)}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;background:var(--c)}
/* sections */
section{margin:52px 0}
.h{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
h2{font:700 28px/1.1 var(--display);margin:0;letter-spacing:-.02em}
.h p{margin:6px 0 0;color:var(--muted)}
.graphbox{display:grid;grid-template-columns:1fr 320px;gap:14px}
.canvas{position:relative;padding:0;overflow:hidden;
  background:radial-gradient(600px 300px at 85% 50%,rgba(255,77,94,.10),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.canvas svg{display:block;width:100%;height:440px;cursor:grab}
.canvas svg.drag{cursor:grabbing}
.glegend{position:absolute;left:16px;bottom:14px;display:flex;gap:14px;font:500 11px var(--mono);color:var(--muted)}
.glegend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.hint{position:absolute;right:16px;top:12px;display:flex;align-items:center;font:500 11px var(--mono);color:var(--dim)}
.node{cursor:pointer}
.node circle.bg{transition:r .2s}
.node text{font:500 12px var(--sans);fill:var(--text);pointer-events:none}
.node text.k{font:500 9.5px var(--mono);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.edge{fill:none;stroke:var(--line2);stroke-width:1.5;transition:opacity .25s,stroke .25s}
.edge.path{stroke:url(#hot);stroke-width:2.2}
.edge.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.elabel{font:500 10px var(--mono);fill:var(--muted);pointer-events:none;transition:opacity .25s;paint-order:stroke;stroke:#161a24;stroke-width:5px;stroke-linejoin:round}
.dim .edge:not(.hl),.dim .elabel:not(.hl){opacity:.08}
.dim .node:not(.hl){opacity:.18}
.edge.hl{stroke:var(--brand);stroke-width:3;filter:drop-shadow(0 0 6px rgba(240,138,36,.7))}
.elabel.hl{fill:#ffd2a1;opacity:1}
.admin-glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;r:34}50%{opacity:.08;r:46}}
.paths{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto;padding:14px}
.p{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.02);cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.p:hover,.p.on{border-color:var(--brand);background:rgba(240,138,36,.07);transform:translateX(-2px)}
.p .who{font:600 13px var(--sans)}
.p .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.p .steps span{font:500 10.5px var(--mono);padding:3px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:#ffcf9e}
.empty{color:var(--muted);padding:30px;text-align:center}
/* findings */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f-chip{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line2);padding:8px 12px;border-radius:99px;cursor:pointer;transition:all .2s}
.f-chip:hover{color:var(--text)}
.f-chip.on{color:#111;background:var(--c,var(--text));border-color:var(--c,var(--text))}
input[type=search]{font:500 13px var(--sans);color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:99px;padding:9px 16px;width:240px;outline:none}
input[type=search]:focus{border-color:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px}
.row{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;opacity:0;transform:translateY(8px);animation:in .45s forwards}
@keyframes in{to{opacity:1;transform:none}}
.row summary{list-style:none;display:grid;grid-template-columns:96px 140px 1fr auto;gap:16px;align-items:center;padding:14px 18px;cursor:pointer}
.row summary::-webkit-details-marker{display:none}
.row[open]{border-color:var(--line2)}
.badge{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:7px;color:#111;background:var(--c);text-align:center}
.rid{font:500 12px var(--mono);color:var(--muted)}
.ttl{font-weight:600}
.ttl small{display:block;font:400 12.5px var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.cis{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:3px 7px;white-space:nowrap}
.body{padding:0 18px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--line);padding-top:16px}
.body h4{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.body p{margin:0;color:#cfd5e2}
.body code{font:500 12.5px var(--mono);color:#ffcf9e}
.chain{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain .hop{font:500 12px var(--mono);padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2)}
.chain .t{font:500 11px var(--mono);color:var(--brand)}
.chain .hop.admin{background:var(--crit);border-color:var(--crit);color:#fff}
.show{font:600 12px var(--sans);color:var(--brand);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
footer{border-top:1px solid var(--line);color:var(--dim);font:500 12px var(--mono);padding:28px 0 40px;margin-top:60px}
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr}.ring{width:180px;height:180px}
  .stats{grid-template-columns:repeat(2,1fr)}.facts{grid-column:1/-1}
  .graphbox{grid-template-columns:1fr}.row summary{grid-template-columns:84px 1fr}.row summary .rid,.row summary .cis{display:none}
  .body{grid-template-columns:1fr}
}
@media (max-width:560px){.wrap{padding:0 16px}input[type=search]{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.row{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div>
      <div class="brand">
        <svg viewBox="0 0 128 128" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f08a24"/><stop offset="1" stop-color="#a3390f"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#bm)"/><path d="M38 100V58l-6-6V30h14v10h10V30h16v10h10V30h14v22l-6 6v42z" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64" cy="72" r="7" fill="#fff"/><path d="M64 76v12" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>
        <b>Warden</b><span id="ver"></span>
      </div>
      <h1 id="headline"></h1>
      <p class="sub" id="lede"></p>
      <div class="meta" id="meta"></div>
    </div>
    <div class="ring" aria-label="posture score">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#262c3b" stroke-width="9"/>
        <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#sg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)"/>
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb15c"/><stop offset="1" stop-color="#ff4d5e"/></linearGradient></defs></svg>
      <div class="v"><div><strong id="score">0</strong><small>posture score</small><span class="grade" id="grade"></span></div></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="legend" id="legend"></div>

  <section>
    <div class="h"><div><h2 id="gtitle">Privilege-escalation graph</h2><p id="gsub"></p></div></div>
    <div class="graphbox">
      <div class="card canvas"><svg id="g"></svg>
        <div class="hint"><button class="f-chip" id="allEdges">paths only</button> &nbsp;drag nodes · hover to trace</div>
        <div class="glegend"><span style="--c:var(--user)">user</span><span style="--c:var(--role)">role</span><span style="--c:var(--group)">group</span><span style="--c:var(--crit)">admin</span></div>
      </div>
      <div class="card paths" id="paths"></div>
    </div>
  </section>

  <section>
    <div class="h"><div><h2>Findings</h2><p id="fsub"></p></div>
      <div class="tools" id="filters"><input type="search" id="q" placeholder="Search rule, resource, file…"></div></div>
    <div class="list" id="list"></div>
  </section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const D = /*__DATA__*/null;
const C = {critical:"var(--crit)",high:"var(--high)",medium:"var(--med)",low:"var(--low)"};
const $ = s => document.querySelector(s);
const el = (t, a = {}, html = "") => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = id => id === "admin" ? "admin" : id.split("::").pop();

// ---------- hero
const total = D.findings.length, paths = D.findings.filter(f => f.hops);
$("#ver").textContent = "v" + D.version;
$("#headline").innerHTML = total === 0 ? "Clean. <em>Nothing to fix.</em>"
  : paths.length ? `<em>${paths.length} way${paths.length > 1 ? "s" : ""} to admin</em><br>and ${total - paths.length} more finding${total - paths.length === 1 ? "" : "s"}.`
  : `<em>${total} finding${total > 1 ? "s" : ""}</em><br>to review before apply.`;
$("#lede").textContent = `Scanned ${D.resources} Terraform resources across ${D.modules} module${D.modules > 1 ? "s" : ""} against ${D.rulesTotal} rules. ${D.cisFailing} of ${D.cisControls} mapped CIS AWS Foundations controls have at least one failure.`;
$("#meta").innerHTML = [["target", D.target], ["generated", D.generated], ["rules hit", `${D.rulesHit}/${D.rulesTotal}`]]
  .map(([k, v]) => `<span class="chip">${k} <b>${esc(v)}</b></span>`).join("");
const gcol = {A:"var(--ok)",B:"#a6e36b",C:"var(--med)",D:"var(--high)",F:"var(--crit)"}[D.grade];
$("#grade").textContent = D.grade; $("#grade").style.background = gcol;
requestAnimationFrame(() => { $("#arc").style.strokeDashoffset = 326.7 * (1 - D.score / 100); });
count($("#score"), D.score);

function count(node, to, ms = 1300) {
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); node.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ---------- stats
const stats = $("#stats");
D.severities.forEach(s => {
  const c = el("div", {class: "card sev", style: `--c:${C[s]}`}, `<div class="n">0</div><div class="l">${s}</div>`);
  stats.append(c); count(c.querySelector(".n"), D.counts[s]);
});
stats.append(el("div", {class: "card facts"},
  `<div><b>${D.resources}</b>resources</div><div><b>${paths.length}</b>paths to admin</div>
   <div><b>${D.rulesHit}</b>rules triggered</div><div><b>${D.cisFailing}</b>CIS controls failing</div>`));
D.severities.forEach(s => {
  const i = el("i", {style: `background:${C[s]}`}); $("#bar").append(i);
  setTimeout(() => i.style.width = (total ? 100 * D.counts[s] / total : 0) + "%", 150);
  $("#legend").append(el("span", {style: `--c:${C[s]}`}, `${D.counts[s]} ${s}`));
});

// ---------- graph
const NS = "http://www.w3.org/2000/svg";
const svg = $("#g");
const G = D.graph;
let showAll = false, E = [], nodes = [], byId = {};
function pick() {
  E = G.edges.filter(e => showAll || e.onPath);
  const used = new Set(E.flatMap(e => [e.source, e.target]));
  nodes = G.nodes.filter(n => used.has(n.id));
  byId = Object.fromEntries(nodes.map(n => [n.id, n]));
}
$("#gsub").textContent = paths.length
  ? `${paths.length} principal${paths.length > 1 ? "s" : ""} can reach admin. Each column is one hop further from admin; highlighted edges are on a shortest path.`
  : "No user or role can chain its permissions into admin.";

function layout() {
  const W = svg.clientWidth || 900, padX = 90, gap = 92;
  const layers = [...new Set(nodes.map(n => n.layer))].sort((a, b) => a - b);
  const cols = {};
  nodes.forEach(n => (cols[n.layer] ||= []).push(n));
  const tallest = Math.max(1, ...Object.values(cols).map(c => c.length));
  const H = Math.max(380, tallest * gap + 80);
  svg.style.height = H + "px";
  // order each column by the average position of its neighbours one hop closer to admin
  layers.forEach((L, li) => {
    const col = cols[L];
    col.forEach(n => {
      const nb = E.filter(e => e.source === n.id).map(e => byId[e.target]).filter(m => m && m.y != null);
      n.key = nb.length ? nb.reduce((t, m) => t + m.y, 0) / nb.length : 1e9;
    });
    col.sort((a, b) => a.key - b.key || a.label.localeCompare(b.label));
    const x = layers.length === 1 ? W / 2 : W - padX - (W - 2 * padX) * (li / (layers.length - 1));
    col.forEach((n, i) => { n.x = x; n.y = H / 2 + (i - (col.length - 1) / 2) * gap; });
  });
}

function edgePath(a, b) {
  const mx = (a.x + b.x) / 2, bend = a.layer === b.layer ? 60 : 0;
  return `M${a.x},${a.y} C${mx},${a.y - bend} ${mx},${b.y - bend} ${b.x},${b.y}`;
}

function draw() {
  svg.innerHTML = `<defs>
    <linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="0" x2="${svg.clientWidth}" y1="0" y2="0"><stop offset="0" stop-color="#ffb15c"/><stop offset="1" stop-color="#ff4d5e"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4a5470"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ff6a4a"/></marker>
    <radialGradient id="ag"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".9"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient></defs>`;
  if (!nodes.length) { svg.insertAdjacentHTML("beforeend", `<text x="50%" y="50%" text-anchor="middle" fill="#6b7489" font-family="monospace">no IAM escalation edges</text>`); return; }
  const gE = document.createElementNS(NS, "g"), gN = document.createElementNS(NS, "g");
  svg.append(gE, gN);
  G.edges.forEach(e => { e.el = e.lab = null; });
  E.forEach((e, i) => {
    const a = byId[e.source], b = byId[e.target]; if (!a || !b) return;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("class", "edge" + (e.onPath ? " path" : ""));
    p.setAttribute("marker-end", e.onPath ? "url(#arh)" : "url(#ar)");
    gE.append(p); e.el = p;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "elabel"); t.setAttribute("text-anchor", "middle"); t.textContent = e.technique;
    gE.append(t); e.lab = t;
  });
  nodes.forEach(n => {
    const g = document.createElementNS(NS, "g"); g.setAttribute("class", "node"); n.el = g;
    const col = n.kind === "admin" ? "var(--crit)" : `var(--${n.kind})`;
    const r = n.kind === "admin" ? 26 : 18;
    g.innerHTML = (n.kind === "admin" ? `<circle class="admin-glow" r="34" fill="url(#ag)"/>` : "") +
      `<circle class="bg" r="${r}" fill="${n.kind === "admin" ? "#ff4d5e" : "#11141b"}" stroke="${col}" stroke-width="${n.risky ? 2.5 : 1.5}"/>` +
      (n.kind === "admin" ? `<text text-anchor="middle" dy="4" style="font:700 12px var(--display)">ADMIN</text>`
        : `<text text-anchor="middle" dy="4" style="font:700 11px var(--mono);fill:${col}">${n.kind[0].toUpperCase()}</text>
           <text text-anchor="middle" dy="${r + 16}">${esc(n.label)}</text>
           <text class="k" text-anchor="middle" dy="${r + 29}">${n.admin ? "has admin" : n.kind}</text>`) +
      `<title>${esc((n.module ? n.module + " / " : "") + (n.address || "admin"))}</title>`;
    gN.append(g);
    g.addEventListener("mouseenter", () => trace(n.id));
    g.addEventListener("mouseleave", () => trace(null));
    drag(g, n);
  });
  place(true);
}

function place(first) {
  E.forEach(e => {
    const a = byId[e.source], b = byId[e.target]; if (!e.el) return;
    // stop the arrow at the node edge
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, rb = b.kind === "admin" ? 30 : 22;
    const bb = {x: b.x - dx / L * rb, y: b.y - dy / L * rb, layer: b.layer};
    e.el.setAttribute("d", edgePath(a, bb));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - (a.layer === b.layer ? 45 : 0);
    e.lab.setAttribute("x", mx); e.lab.setAttribute("y", my - 6);
    if (first) { const len = e.el.getTotalLength(); e.el.style.setProperty("--len", len); e.el.classList.add("draw"); e.el.style.animationDelay = (0.25 + 0.25 * (a.layer > 0 ? 3 - Math.min(3, a.layer) : 3)) + "s"; }
  });
  nodes.forEach(n => n.el.setAttribute("transform", `translate(${n.x},${n.y})`));
}

function drag(g, n) {
  let on = false, ox = 0, oy = 0;
  g.addEventListener("pointerdown", ev => { on = true; svg.classList.add("drag"); g.setPointerCapture(ev.pointerId);
    const p = pt(ev); ox = p.x - n.x; oy = p.y - n.y; });
  g.addEventListener("pointermove", ev => { if (!on) return; const p = pt(ev); n.x = p.x - ox; n.y = p.y - oy; place(false); });
  g.addEventListener("pointerup", () => { on = false; svg.classList.remove("drag"); });
}
function pt(ev) { const r = svg.getBoundingClientRect(); return {x: ev.clientX - r.left, y: ev.clientY - r.top}; }

function trace(id, hops) {
  svg.classList.toggle("dim", !!(id || hops));
  document.querySelectorAll("#g .hl").forEach(x => x.classList.remove("hl"));
  if (!id && !hops) return;
  let set;
  if (hops) set = new Set(hops.slice(0, -1).map((h, i) => h + ">" + hops[i + 1]));
  else { // follow shortest-path edges forward from the hovered node
    set = new Set(); const seen = new Set([id]); const q = [id];
    while (q.length) { const c = q.shift(); E.filter(e => e.source === c && (e.onPath || e.target === "admin")).forEach(e => { set.add(e.source + ">" + e.target); if (!seen.has(e.target)) { seen.add(e.target); q.push(e.target); } }); }
  }
  const lit = new Set([id].filter(Boolean));
  E.forEach(e => { if (set.has(e.source + ">" + e.target)) { e.el?.classList.add("hl"); e.lab?.classList.add("hl"); lit.add(e.source); lit.add(e.target); } });
  nodes.forEach(n => lit.has(n.id) && n.el.classList.add("hl"));
}

function pathList() {
  const box = $("#paths");
  if (!paths.length) { box.innerHTML = `<div class="empty">No escalation paths found.</div>`; return; }
  box.innerHTML = `<div style="font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)">${paths.length} paths to admin</div>`;
  paths.forEach(f => {
    const hops = f.hops[f.hops.length - 1] === "admin" ? f.hops : [...f.hops, "admin"];
    const c = el("div", {class: "p"}, `<div class="who">${esc(short(f.hops[0]))}${f.module && D.modules > 1 ? `<span style="color:var(--dim);font:500 11px var(--mono)"> · ${esc(f.module)}</span>` : ""}</div>
      <div class="steps">${f.path.map(s => `<span>${esc(s.technique)}</span>`).join("")}</div>`);
    c.addEventListener("mouseenter", () => trace(null, hops));
    c.addEventListener("mouseleave", () => { if (!c.classList.contains("on")) trace(null); });
    c.addEventListener("click", () => { const was = c.classList.contains("on"); document.querySelectorAll(".p.on").forEach(x => x.classList.remove("on")); if (!was) { c.classList.add("on"); trace(null, hops); } else trace(null); });
    box.append(c);
  });
}

// ---------- findings
let sev = "all", q = "";
const filters = $("#filters");
["all", ...D.severities].forEach(s => {
  const b = el("button", {class: "f-chip" + (s === "all" ? " on" : ""), style: s === "all" ? "" : `--c:${C[s]}`},
    s === "all" ? `all ${total}` : `${s} ${D.counts[s]}`);
  b.onclick = () => { sev = s; filters.querySelectorAll(".f-chip").forEach(x => x.classList.toggle("on", x === b)); list(); };
  filters.insertBefore(b, $("#q"));
});
$("#q").addEventListener("input", e => { q = e.target.value.toLowerCase(); list(); });

function list() {
  const box = $("#list"); box.innerHTML = "";
  const rows = D.findings.filter(f => (sev === "all" || f.severity === sev) &&
    (!q || [f.rule, f.title, f.resource, f.file, f.message, f.cis].join(" ").toLowerCase().includes(q)));
  $("#fsub").textContent = `${rows.length} of ${total} shown. Click a row for the fix.`;
  if (!rows.length) { box.innerHTML = `<div class="card empty">${total ? "Nothing matches." : "No findings. Ship it."}</div>`; return; }
  rows.forEach((f, i) => {
    const d = el("details", {class: "row", style: `animation-delay:${Math.min(i, 20) * 25}ms`});
    const chain = f.hops ? `<div class="chain">${f.path.map(s => `<span class="hop">${esc(short(s.from))}</span><span class="t">${esc(s.technique)} →</span>`).join("")}
      <span class="hop ${f.path[f.path.length - 1].to === "admin" ? "admin" : ""}">${esc(short(f.path[f.path.length - 1].to))}${f.path[f.path.length - 1].to === "admin" ? "" : " (admin)"}</span>
      <button class="show">show in graph</button></div>` : "";
    d.innerHTML = `<summary><span class="badge" style="--c:${C[f.severity]}">${f.severity}</span><span class="rid">${f.rule}</span>
      <span class="ttl">${esc(f.title)}<small>${esc(f.resource)} · ${esc(f.file)}:${f.line}</small></span>
      <span class="cis">${f.cis ? "CIS " + esc(f.cis) : "best practice"}</span></summary>
      <div class="body">${chain}
        <div><h4>Finding</h4><p>${esc(f.message)}</p></div>
        <div><h4>Fix</h4><p>${esc(f.fix)}</p></div>
        <div><h4>Why it matters</h4><p>${esc(f.description)}</p></div>
        <div><h4>Reference</h4><p><code>${esc(f.cwe || "—")}</code>${f.cis ? ` · <code>CIS AWS Foundations v3.0 ${esc(f.cis)}</code>` : ""} · <code>${esc(f.file)}:${f.line}</code></p></div></div>`;
    const btn = d.querySelector(".show");
    if (btn) btn.onclick = e => { e.preventDefault(); const hops = f.hops[f.hops.length - 1] === "admin" ? f.hops : [...f.hops, "admin"];
      $("#g").scrollIntoView({behavior: "smooth", block: "center"}); trace(null, hops); };
    box.append(d);
  });
}

$("#foot").innerHTML = `warden ${esc(D.version)} · ${esc(D.generated)} · static analysis of Terraform, no cloud account used`;
const tog = $("#allEdges");
tog.onclick = () => { showAll = !showAll; tog.classList.toggle("on", showAll); tog.textContent = showAll ? "all edges" : "paths only"; pick(); layout(); draw(); };
pick(); layout(); draw(); pathList(); list();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { layout(); draw(); }, 150); });
</script>
</body>
