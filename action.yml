name: warden IaC scan
description: Scan Terraform for AWS misconfigurations and IAM privilege-escalation paths, with SARIF output.
branding:
  icon: shield
  color: orange
inputs:
  path:
    description: Directory or .tf file to scan
    default: "."
  fail-on:
    description: Fail the step on findings at or above this severity (low, medium, high, critical, none)
    default: high
  sarif-file:
    description: Where to write the SARIF report
    default: warden.sarif
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install -q "${{ github.action_path }}"
    - shell: bash
      run: |
        warden scan "${{ inputs.path }}" -f sarif -o "${{ inputs.sarif-file }}" --fail-on none
        warden scan "${{ inputs.path }}" -f markdown --fail-on none >> "$GITHUB_STEP_SUMMARY"
        warden scan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" --no-color
