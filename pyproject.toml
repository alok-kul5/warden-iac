[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-iac"
version = "0.1.0"
description = "Terraform misconfiguration and IAM privilege-escalation scanner with SARIF output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alok Kulkarni" }]
dependencies = ["python-hcl2>=7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
